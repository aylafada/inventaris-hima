<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPUS-Mini | Daftar Anggota</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <header>
        <h1>SIMPUS-Mini</h1>

        <button type="button" id="nav-toggle-btn" class="nav-toggle-label">
            &#9776;
        </button>

        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="../buku/list.html">Daftar Buku</a></li>
                <li><a href="list.html">Daftar Anggota</a></li>
                <li><a href="tambah.html">Tambah Anggota</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Daftar Anggota</h2>

            <div class="search-box">
                <label for="search-input">Cari Nama Anggota</label>
                <input 
                    type="text" 
                    id="search-input" 
                    data-column="1" 
                    placeholder="Ketik nama anggota..."
                >
            </div>

            <div id="loading-anggota" class="loading">
                Memuat data...
            </div>

            <div id="error-anggota" class="error"></div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>No.Anggota</th>
                            <th>Nama</th>
                            <th>Alamat</th>
                            <th>No. HP</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>

                    <tbody id="tabel-anggota">
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 6</p>
    </footer>

    <script src="../assets/js/app.js"></script>

</body>
</html>
