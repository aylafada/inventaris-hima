<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | Tambah Buku</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<aside class="sidebar">
    <h4>SIMPUS-Mini</h4>
    <nav class="nav flex-column">
        <a class="nav-link" href="../index.html">Beranda</a>
        <a class="nav-link" href="list.html">Daftar Buku</a>
        <a class="nav-link active" href="tambah.html">Tambah Buku</a>
        <a class="nav-link" href="../anggota/list.html">Daftar Anggota</a>
        <a class="nav-link" href="../anggota/tambah.html">Tambah Anggota</a>
    </nav>
</aside>

<main class="main-content">
    <section class="card shadow-sm mb-4">
        <div class="card-body">
            <h2 class="card-title mb-3">Tambah Buku</h2>

            <form>
                <div class="mb-3">
                    <label for="judul" class="form-label fw-semibold">Judul</label>
                    <input type="text" class="form-control" id="judul" name="judul" required>
                </div>

                <div class="mb-3">
                    <label for="pengarang" class="form-label fw-semibold">Pengarang</label>
                    <input type="text" class="form-control" id="pengarang" name="pengarang" required>
                </div>

                <div class="mb-3">
                    <label for="tahun" class="form-label fw-semibold">Tahun Terbit</label>
                    <input type="number" class="form-control" id="tahun" name="tahun" min="1900" max="2026" required>
                </div>

                <div class="mb-3">
                    <label for="isbn" class="form-label fw-semibold">ISBN</label>
                    <input type="text" class="form-control" id="isbn" name="isbn">
                </div>

                <div class="mb-3">
                    <label for="stok" class="form-label fw-semibold">Stok</label>
                    <input type="number" class="form-control" id="stok" name="stok" min="0" required>
                </div>

                <div class="mb-3">
                    <label for="kategori" class="form-label fw-semibold">Kategori</label>
                    <select class="form-select" id="kategori" name="kategori">
                        <option value="fiksi">Fiksi</option>
                        <option value="non-fiksi">Non-Fiksi</option>
                        <option value="referensi">Referensi</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">Simpan</button>
            </form>
        </div>
    </section>
</main>

<footer class="text-center text-secondary py-3 small">

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
